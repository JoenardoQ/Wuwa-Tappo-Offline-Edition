<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"><title>Wuwa Tappo · 离线版</title><link rel="stylesheet" href="original-ui/index-BjTCKBy6.css"><link rel="stylesheet" href="studio.css"></head><body class="locale-zh">
<div id="replicaRoot" class="module-panel"><nav class="tab-bar"><div class="tab-logo"></div><button class="tab-btn tab-btn--active" data-page="collection"><i class="tab-btn__icon tab-btn__icon--bag"></i><span class="tab-btn__label">背包</span></button><button class="tab-btn" data-page="atlas"><i class="tab-btn__icon tab-btn__icon--atlas"></i><span class="tab-btn__label">图鉴</span></button><button class="tab-btn" data-page="synthesis"><i class="tab-btn__icon tab-btn__icon--exchange"></i><span class="tab-btn__label">合成</span></button><button class="tab-btn" data-page="draw"><i class="tab-btn__icon tab-btn__icon--room"></i><span class="tab-btn__label">开箱</span></button><button class="tab-btn" data-page="settings"><i class="tab-btn__icon tab-btn__icon--setting"></i><span class="tab-btn__label">设置</span></button><button id="hidePanel" class="tab-btn"><i class="tab-btn__icon tab-btn__icon--toggle"></i><span class="tab-btn__label">收起</span></button></nav>
<main class="module-content"><div class="module-content__bg"></div><div class="panel-drag"></div><button id="closePanel" class="panel-close" title="收起面板"></button>
<section id="page-collection" class="page module-block role-panel"><div class="panel-content"><div class="preset-content" id="currentOutfit"><div class="preset-preview"><div class="preset-preview-main"><div class="preset-preview-img-box"><div class="offline-preview"><img id="heroHead"><img id="heroBody"><img id="heroAccessory"></div></div><div id="previewEmotes"></div></div></div><div class="my-preset"><div class="my-preset-title">我的预设</div><div class="my-preset-list" id="miniPresets"></div></div></div>
<div class="atlas-tab" id="typeTabs"><button class="atlas-tab-item selected" data-type="all" id="allTab">最近获得</button><button class="atlas-tab-item" data-type="character">角色</button><button class="atlas-tab-item" data-type="accessory">配件</button><button class="atlas-tab-item" data-type="emote">表情</button></div><div id="filterBar" class="atlas-select"></div><div class="atlas-content"><div id="inventory" class="atlas-section common-scrollbar2"></div><button id="loadMore" class="common-btn more" hidden>显示更多</button></div></div></section>
<section id="page-draw" hidden class="page module-block"><div class="panel-content draw-content"><div class="draw-banner"><img class="chest-art" src="original-ui/chest-base-gold-BKP4rDVz.png"><h2>开启宝箱</h2><p>角色、配件、表情 · 无限抽取</p><div class="draw-buttons"><button class="common-btn" data-draw="1">单抽 ∞</button><button class="common-btn" data-draw="10">十连抽 ∞</button></div><p id="pity"></p></div><p class="rules">本地抽取：普通65% · 珍稀25% · 稀有9% · 史诗1%。十连至少一件珍稀或以上，最多50抽获得史诗。</p><div class="section-title"><h3>最近获得</h3><span id="drawTotal"></span></div><div id="history" class="history"></div></div></section>
<section id="page-synthesis" hidden class="page module-block synthesis-panel"><div class="panel-content"><div class="atlas-tab"><button class="atlas-tab-item selected" data-synth-mode="upgrade">升阶合成</button><button class="atlas-tab-item" data-synth-mode="same">平阶合成</button></div><div class="synthesis-main"><div class="synthesis-success" id="synthesisCircle"></div><div class="synthesis-list" id="synthesisSlots"></div><div class="synthesis-tip" id="synthesisTip"></div><div class="synthesis-btns"><button class="common-btn" id="autoSelect">一键选择</button><button class="common-btn" data-synth-count="1" disabled>单次合成</button><button class="common-btn" data-synth-count="10" disabled>十连合成</button></div><p id="synthesisSelected" class="synthesis-selected"></p></div></div></section>
<section id="page-presets" hidden class="page module-block"><div class="panel-content"><div class="save-preset"><input id="presetName" maxlength="24" placeholder="预设名称"><button class="common-btn" id="savePreset">保存当前搭配</button></div><div id="presets" class="presets"></div></div></section>
<section id="page-settings" hidden class="page module-block settings-module"><div class="panel-content"><div id="settingsRows"></div><div class="setting-btns"><button class="common-btn" id="openFolder">查看存档</button><div class="setting-btns-right"><button class="common-btn" id="recenter">找回桌宠</button><button class="common-btn" id="quit">退出应用</button></div></div><div class="setting-copyright">Wuwa Tappo · 个人离线版 <span id="hookStatus"></span></div></div></section>
</main></div><div id="toast" role="status"></div><dialog id="results"><button class="popup-close" id="closeResults" title="关闭"></button><h2 id="resultTitle">获得物品</h2><div id="resultGrid" class="result-grid"></div><div class="result-footer"><p>已保存到背包</p><button class="common-btn" id="drawAgain">再抽十次 ∞</button></div></dialog>
<dialog id="materialPicker"><button class="popup-close" id="closeMaterials"></button><h2>选择合成材料</h2><div id="materialGroups"></div><p>只使用多余副本，保留每件物品的最后一份。</p></dialog><script src="studio.js"></script></body></html>
