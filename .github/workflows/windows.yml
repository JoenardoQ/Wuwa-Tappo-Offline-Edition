name: Windows portable
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/WuwaTappo-Offline-* -DestinationPath dist/WuwaTappo-Offline-Windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: WuwaTappo-Offline-Windows-x64
          path: dist/*.zip
          retention-days: 7
          if-no-files-found: error
